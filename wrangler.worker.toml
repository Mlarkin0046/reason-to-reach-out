name = "reason-to-reach-out-api"
main = "worker/index.js"
compatibility_date = "2026-09-28"
keep_vars = true

[ai]
binding = "AI"

[[ratelimits]]
name = "GENERATION_RATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "VERIFICATION_REQUEST_RATE_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "VERIFICATION_CONFIRM_RATE_LIMIT"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "EVENT_RATE_LIMIT"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 60
  period = 60
